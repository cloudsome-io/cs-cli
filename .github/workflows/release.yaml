name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          rm -rf dist
          chmod +x scripts/build.sh
          # Extract version from tag (remove 'v' prefix if present)
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          export CF_BUILD_SHA="${GITHUB_SHA:0:7}"
          export CF_BUILD_DATE=$(date -u +"%Y-%m-%d")
          ./scripts/build.sh

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${CURRENT_TAG}")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          fi

          {
            echo "notes<<EOF"
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "No commits found."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload macOS binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/*darwin*
          retention-days: 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/**

  sign-macos:
    needs: build-and-release
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist/

      - name: Import signing certificate
        env:
          SIGNING_KEY_MAC_PFX: ${{ secrets.SIGNING_KEY_MAC_PFX }}
          SIGNING_KEY_MAC_PASSPHRASE: ${{ secrets.SIGNING_KEY_MAC_PASSPHRASE }}
          SIGNING_KEYCHAIN_PASSPHRASE: ${{ secrets.SIGNING_KEYCHAIN_PASSPHRASE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$SIGNING_KEY_MAC_PFX" | base64 --decode -o "$P12_PATH"

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSPHRASE" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSPHRASE" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_KEY_MAC_PASSPHRASE" \
            -T /usr/bin/codesign \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$SIGNING_KEYCHAIN_PASSPHRASE" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign and notarize macOS binaries
        env:
          SIGNING_KEY_MAC_ID: ${{ secrets.SIGNING_KEY_MAC_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          WORK_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$WORK_DIR"

          for archive in dist/*darwin*.tgz; do
            [ -f "$archive" ] || continue
            BASENAME=$(basename "$archive" .tgz)
            EXTRACT_DIR="$WORK_DIR/$BASENAME"
            mkdir -p "$EXTRACT_DIR"

            echo "==> Extracting $archive"
            tar -xzf "$archive" -C "$EXTRACT_DIR"

            # Sign each Mach-O binary inside the archive
            for binary in "$EXTRACT_DIR"/*; do
              [ -f "$binary" ] || continue
              echo "    Signing $binary"
              codesign \
                --force \
                --options runtime \
                --sign "$SIGNING_KEY_MAC_ID" \
                --timestamp \
                "$binary"
              codesign --verify --verbose "$binary"
            done

            # Repack the archive
            echo "==> Repacking $archive"
            tar -czf "$archive" -C "$EXTRACT_DIR" .

            # notarytool requires .zip
            ZIP_PATH="$WORK_DIR/$BASENAME.zip"
            zip -j "$ZIP_PATH" "$EXTRACT_DIR"/*
            echo "==> Notarizing $archive"
            xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

            rm -rf "$EXTRACT_DIR"
          done

      - name: Upload signed macOS binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*darwin*
